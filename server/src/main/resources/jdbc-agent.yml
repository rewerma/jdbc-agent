jdbcAgent:
  zkServers: 127.0.0.1:2181
  ip: 127.0.0.1
  port: 10101
  catalog: mytest
  # 链路使用 TLS。证书 SAN 需要包含客户端实际连接的主机名或 IP，口令和 SQL 不再明文传输
  sslKeyStore: conf/jdbc-agent.p12
  sslKeyStorePassword: changeit
  sslKeyStoreType: PKCS12
  dataSources:
    - accessUsername: test
      accessPassword: 123456
      # 该数据源允许同时存在的 server 端 JDBC 连接数，超过后拒绝新建；不配置则不限制
      maxConnections: 20
      dsManager:
        driverClass: com.mysql.jdbc.Driver
        jdbcUrl: jdbc:mysql://127.0.0.1:3306/mytest
        username: root
        password: 121212