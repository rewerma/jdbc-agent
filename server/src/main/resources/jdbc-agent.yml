jdbcAgent:
  zkServers: 127.0.0.1:2181
  # mode 不写或 ha 时只有一台持有 /running。cluster 时每台注册 /servers 下的临时节点，客户端把一条连接粘在同一台
  # mode: cluster
  # weight: 1
  ip: 127.0.0.1
  port: 10101
  catalog: mytest
  # 链路使用 TLS。证书 SAN 需要包含客户端实际连接的主机名或 IP，口令和 SQL 不再明文传输
  sslKeyStore: conf/jdbc-agent.p12
  sslKeyStorePassword: changeit
  sslKeyStoreType: PKCS12
  # JDBC 驱动不放在 libs。每个插件一个子目录，单独的类加载器，例如 plugin/mysql、plugin/postgresql。
  # 未设置 -Dja.plugins 时，启动脚本用和 conf 同级的 plugin 目录。
  dataSources:
    - accessUsername: test
      accessPassword: 123456
      # 该数据源允许同时存在的 server 端 JDBC 连接数，超过后拒绝新建；不配置则不限制
      maxConnections: 20
      dsManager:
        driverClass: com.mysql.jdbc.Driver
        jdbcUrl: jdbc:mysql://127.0.0.1:3306/mytest
        username: root
        password: 121212